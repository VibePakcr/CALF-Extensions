[package]
name = "calf-ffmpeg"
version = "0.2.0-preview.2"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "=1.0.102"
serde = "=1.0.228"
serde_json = "=1.0.150"
sha2 = "=0.10.9"
uuid = { version = "=1.23.3", features = ["v4"] }
chrono = "=0.4.45"
regex = "=1.12.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
