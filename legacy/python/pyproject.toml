# Historical Python distribution metadata. Not a current package entry point.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calf-extensions"
version = "0.1.0"
description = "Local runtime integrations for CALF; FFmpeg scene workflow preview"
requires-python = ">=3.10"
license = {file = "LICENSE-EXTENSIONS.txt"}
dependencies = []

[project.scripts]
calf-media = "calf_extensions.media_ffmpeg.cli:main"
calf-pack = "calf_extensions.packs.cli:main"
calf-repo = "calf_extensions.repository.cli:main"

[tool.setuptools.packages.find]
include = ["calf_extensions*"]

[tool.setuptools.package-data]
"calf_extensions.media_ffmpeg" = ["profile.json"]
"calf_extensions.packs" = ["manifest.schema.json"]
"calf_extensions.repository" = ["assets/*.html", "assets/*.css", "assets/*.js", "schemas/*.json"]
