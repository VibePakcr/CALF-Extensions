<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CALF Project Navigator</title><style>/*STYLE*/</style></head><body>
<header><a href="#overview" class="brand">CALF <span>Project Navigator</span></a><nav><a id="sources-nav" href="#sources-panel" data-i="sourcesTitle" hidden></a><a href="#overview" data-i="overview"></a><a href="#features" data-i="features"></a><a href="#source-map" data-i="map"></a><a href="#documents" data-i="documents"></a></nav><label><span data-i="language"></span> <select id="language"><option value="en">English</option><option value="ko">한국어</option></select></label></header>
<main><section id="sources-panel" hidden><h2 data-i="sourcesTitle"></h2><div class="toolbar"><label><span data-i="sourceLabel"></span><select id="source-select"></select></label><label><span data-i="savedCaptures"></span><select id="saved-select"></select></label><button id="open-saved" data-i="openSaved"></button></div><div id="ref-controls" class="toolbar"><label><span data-i="rightRef"></span><select id="ref-kind"><option value="branch">branch</option><option value="tag">tag</option><option value="commit">commit</option></select><input id="ref-name" maxlength="4096" autocomplete="off" spellcheck="false" aria-label="Right ref"></label><label><span data-i="leftRef"></span><select id="left-kind"><option value="parent" data-i="firstParent"></option><option value="branch">branch</option><option value="tag">tag</option><option value="commit">commit</option></select><input id="left-ref" maxlength="4096" autocomplete="off" spellcheck="false" aria-label="Left ref" disabled></label><button id="collect" data-i="collectSource"></button><button id="cancel-collection" data-i="cancelCollection" disabled></button></div><p id="collection-status" class="notice" role="status"></p><p data-i="sourceFlowNote" class="muted"></p><details id="registration-form"><summary data-i="registerSource"></summary><div class="toolbar"><select id="register-provider" aria-label="Provider"><option value="github">GitHub.com</option><option value="gitlab">GitLab.com</option></select><label><span data-i="repositoryUrl"></span><input id="register-url" type="url" autocomplete="off" spellcheck="false"></label><label><span data-i="credentialReference"></span><input id="register-env" maxlength="128" autocomplete="off" spellcheck="false"></label><button id="register-source" data-i="registerSource"></button><button id="check-source" data-i="checkIdentity"></button><button id="remove-source" data-i="removeSource"></button></div></details></section><section id="overview"><h1 id="project-title">CALF Project Navigator</h1><p id="project-description"></p><p id="identity" class="muted"></p><p id="coverage" class="notice" role="status"></p><button id="refresh" data-i="refresh"></button></section>
<section id="features"><h2 data-i="features"></h2><div id="feature-list" class="cards"></div><details><summary data-i="glossary"></summary><div id="term-list" class="cards"></div></details></section>
<section id="source-map"><h2 data-i="map"></h2><p data-i="scope-note" class="muted"></p><div class="toolbar"><label><span data-i="search"></span><input id="search" type="search"></label><label><span data-i="layer"></span><select id="layer"><option value="files" data-i="file-layer"></option><option value="symbols" data-i="symbol-layer"></option></select></label><label><span data-i="depth"></span><select id="depth"><option>1</option><option selected>2</option><option>3</option><option value="all" data-i="all"></option></select></label><label><span data-i="direction"></span><select id="direction"><option value="both" data-i="both"></option><option value="in" data-i="incoming"></option><option value="out" data-i="outgoing"></option></select></label><label><input id="external" type="checkbox" checked><span data-i="external"></span></label><button id="back" data-i="back"></button><button id="forward" data-i="forward"></button><button id="bookmark" data-i="bookmark"></button></div>
<div id="search-results" class="results"></div><div class="toolbar"><button id="zoom-out">−</button><output id="zoom-level"></output><button id="zoom-in">+</button><button id="fit" data-i="fit"></button><button id="impact" data-i="impact"></button></div><p id="graph-count" role="status"></p><div id="canvas"><svg id="graph" tabindex="0" role="group" aria-label="Project relationship map"></svg></div><p data-i="map-help" class="muted"></p><p id="selection" class="notice"></p>
<section id="inspector"><div class="inspector-heading"><h3 id="node-title"></h3><label><span data-i="height"></span><input id="height" type="range" min="180" max="720" value="330" step="30"></label><button id="collapse" data-i="collapse" aria-expanded="true"></button></div><div id="inspector-body"><p id="node-meta" class="muted"></p><div id="node-description" class="description"></div><div id="node-features" class="cards"></div><div id="edge-detail" class="notice"></div><div class="toolbar"><select id="version"><option value="captured" data-i="captured"></option><option value="head">HEAD</option><option value="index" data-i="index"></option><option value="working" data-i="working"></option><option value="stage1">stage 1</option><option value="stage2">stage 2</option><option value="stage3">stage 3</option></select><button id="code-tab" data-i="code"></button><button id="diff-tab" data-i="diff"></button><button id="pin" data-i="pin"></button></div><div id="source-identity" class="muted"></div><div class="toolbar"><label><span data-i="line"></span><input type="number" id="line" min="1" value="1"></label><button id="previous-lines" data-i="previous-lines"></button><button id="next-lines" data-i="next-lines"></button><span id="line-range"></span></div><div id="code" tabindex="0"></div><p id="source-status" role="status"></p><div class="toolbar"><button id="prepare-editor" data-i="prepareCopy" hidden></button><a id="editor" data-i="editor"></a><a id="provider-link" data-i="providerLink" target="_blank" rel="noreferrer noopener" hidden></a><button id="copy-path" data-i="copy-path"></button></div><details id="pinned"><summary data-i="pinned"></summary><div id="pinned-content"></div></details><details><summary data-i="relations"></summary><div id="relations"></div></details></div></section></section>
<section id="changes-panel" hidden><h2 data-i="changedPaths"></h2><p id="changes-status" class="muted"></p><div class="toolbar"><button id="changes-prev" data-i="previousPage"></button><button id="changes-next" data-i="nextPage"></button></div><div id="change-list" class="change-list"></div></section><section id="documents"><h2 data-i="documents"></h2><div id="document-list" class="cards"></div><details><summary data-i="analysis-gaps"></summary><div id="analysis-gaps"></div></details></section><p id="error" role="alert"></p></main><script>/*BOOTSTRAP*/</script><script>/*SCRIPT*/</script></body></html>
